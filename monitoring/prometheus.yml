global:
  scrape_interval: 5s          # how often to read /metrics (demo value; production: 15s)
  evaluation_interval: 5s      # how often to check the alert rules

rule_files:
  - /etc/prometheus/alert_rules.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ["alertmanager:9093"]

scrape_configs:
  - job_name: fastapi
    static_configs:
      - targets: ["api:8000"]
